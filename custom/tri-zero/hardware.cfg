# Drivers, extruder, bed and kinematics for the rebuilt Tri-Zero (pin aliases live in custom/mcus/).
[extruder]
full_steps_per_rotation: 200
filament_diameter: 1.750
pressure_advance_smooth_time: 0.02

[firmware_retraction]
retract_speed: 120
unretract_extra_length: 0
unretract_speed: 120

# Hotend
# Board wiring only. Hotend model, limits and MPC settings are owned by custom/hotends/tk.cfg (identical to Doomcube's).
[extruder]
heater_pin: toolboard_t0:PB13
sensor_pin: toolboard_t0:PA3
pullup_resistor: 2200

[firmware_retraction]
retract_length: 0.5

# ADXL345 resonance testing configuration

[tmc5160 stepper_x]
cs_pin: PC4
spi_software_mosi_pin: PA7
spi_software_miso_pin: PA6
spi_software_sclk_pin: PA5
sense_resistor: 0.075

[stepper_x]
step_pin: PF13
dir_pin: PF12
enable_pin: !PF14
microsteps: 64
full_steps_per_rotation: 200

#---------------------------------------------------- Y -----------------------------------------------------
# The B motor in the CoreXY system
# Connected to MOTOR 1 on BIGTREETECH Octopus Pro H723 V1.1
# Driver: BTT TMC5160(T) Pro v1.1
# Motor: Generic Stepper
# Voltage: 48
#------------------------------------------------------------------------------------------------------------

[tmc5160 stepper_y]
cs_pin: PD11
spi_software_mosi_pin: PA7
spi_software_miso_pin: PA6
spi_software_sclk_pin: PA5
sense_resistor: 0.075

[stepper_y]
step_pin: PG0
dir_pin: PG1
enable_pin: !PF15
microsteps: 64
full_steps_per_rotation: 200

#------------------------------------------------- EXTRUDER -------------------------------------------------
# The extruder motor used for your toolhead
# Connected to EBB36 v1.2
# Driver: BTT TMC2209 v1.3
# Motor: Generic Stepper
# Voltage: 24
#------------------------------------------------------------------------------------------------------------

[tmc2209 extruder]
uart_pin: toolboard_t0:PA15
sense_resistor: 0.11

[extruder]
step_pin: toolboard_t0:PD0
dir_pin: toolboard_t0:PD1
enable_pin: !toolboard_t0:PD2
microsteps: 64
full_steps_per_rotation: 200

[printer]
kinematics: corexy

# Bed wired 2026-10-19 (PA1 heater, PF3 thermistor). No PID saved yet: runs watermark control
# until PID_CALIBRATE HEATER=heater_bed (attended) writes a profile.
[heater_bed]
heater_pin: heater_bed_heating_pin
sensor_pin: heater_bed_sensor_pin
sensor_type: NTC 100K MGB18-104F39050L32
control: watermark
min_temp: 0
max_temp: 120
