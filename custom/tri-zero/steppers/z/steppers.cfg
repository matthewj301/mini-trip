# https://github.com/zruncho3d/ZeroClick/tree/main


[tmc2209 stepper_z]
sense_resistor: 0.11
stealthchop_threshold: 0
uart_pin: PE1
run_current: 1
interpolate: true

[tmc2209 stepper_z1]
sense_resistor: 0.11
stealthchop_threshold: 0
uart_pin: PD3
run_current: 1
interpolate: true

[tmc2209 stepper_z2]
sense_resistor: 0.11
stealthchop_threshold: 0
uart_pin: z0_uart_pin
run_current: 1
interpolate: true


[stepper_z]
endstop_pin: probe:z_virtual_endstop
full_steps_per_rotation: 200
homing_speed: 50
enable_pin: !PD4
step_pin: PE2
dir_pin: PE3
rotation_distance: 40
microsteps: 128

[stepper_z1]
full_steps_per_rotation: 200
enable_pin: !PE0
step_pin: PE6
dir_pin: PA14
rotation_distance: 40
microsteps: 128

[stepper_z2]
full_steps_per_rotation: 200
enable_pin: !z0_enable_pin
step_pin: z0_step_pin
dir_pin: !z0_dir_pin
rotation_distance: 40
microsteps: 128