# BTT SFS V2.0 on Octopus Pro V1.1 (per BTT wiring diagram): switch = PG12, motion = PG13.
# PG13 is also the Z0 DIAG alias (unused; Z does not home sensorless). Polarity/detection_length from the BTT
# default; verify with QUERY_FILAMENT_SENSOR and a real extrusion before trusting runout/jam pauses.
[filament_switch_sensor filament_switch]
switch_pin: ^sfs_switch_pin
pause_on_runout: True

[filament_motion_sensor filament_motion]
switch_pin: ^sfs_motion_pin
extruder: extruder
detection_length: 7
pause_on_runout: True
