# Klipper Expander (STM32F042, USB, Katapult): 4x 3A MOSFET outputs, 2 thermistor inputs.
# Pins: MOSFET0-3 = PA0-PA3, T0 = PA6, T1 = PA5, GPIO = PA7, NeoPixel = PB1.
[mcu expander]
serial: /dev/serial/by-id/usb-Klipper_stm32f042x6_030017000C43303054313620-if00
restart_method: command

[board_pins expander]
mcu: expander
aliases:
	# Stepper-driver cooling fans, confirmed by live test 2026-10-19 (MOSFET2 + MOSFET3).
	stepper_fan_a_pin=PA2,
	stepper_fan_b_pin=PA3
