# BTT Octopus Pro H723 v1.1 (USB, Katapult). Serial from /dev/serial/by-id.
[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32h723xx_1B0019000D51313339373836-if00
restart_method: command

[board_pins btt-octopus-pro-h723-11]
aliases:
	#----------------------------------------------- X motor pins -----------------------------------------------
	# Assigned to slot: "MOTOR 1" (X and Y slots are swapped vs. the board labels: buzz/jog test 2026-10-20 showed
	# the CoreXY A/B roles were mirrored, so the logical X driver is the MOTOR 1 slot)
	#------------------------------------------------------------------------------------------------------------
	x_step_pin=PG0,
	x_dir_pin=PG1,
	x_enable_pin=PF15,
	x_uart_pin=PD11,
	x_diag_pin=PG9,
	x_endstop_pin=PG9,
	#----------------------------------------------- Y motor pins -----------------------------------------------
	# Assigned to slot: "MOTOR 0"
	#------------------------------------------------------------------------------------------------------------
	y_step_pin=PF13,
	y_dir_pin=PF12,
	y_enable_pin=PF14,
	y_uart_pin=PC4,
	y_diag_pin=PG6,
	y_endstop_pin=PG6,
	#----------------------------------------------- Z motor pins -----------------------------------------------
	# Assigned to slot: "MOTOR 5"
	#------------------------------------------------------------------------------------------------------------
	z0_step_pin=PC13,
	z0_dir_pin=PF0,
	z0_enable_pin=PF1,
	z0_uart_pin=PE4,
	z0_diag_pin=PG13,
	#------------------------------------------- EXTRUDER motor pins --------------------------------------------
	e_step_pin=PF11,
	e_dir_pin=PG3,
	e_enable_pin=PG5,
	e_uart_pin=PC6,
	#----------------------------------------------- GENERAL PINS -----------------------------------------------
	e_heater_pin=PA0,
	e_sensor_pin=PF4,
	stepper_spi_mosi_pin=PA7,
	stepper_spi_miso_pin=PA6,
	stepper_spi_sclk_pin=PA5,
	adxl345_cs_pin=PA15,
	bltouch_sensor_pin=PB7,
	bltouch_control_pin=PB6,
	probe_pin=PB7,
	sfs_switch_pin=PG12,
	sfs_motion_pin=PG13,
	# Fan headers, confirmed by live test 2026-10-19 (SET_FAN_SPEED on each header).
	fan0_electronics_pin=PA8,
	fan1_filter_pin=PE5,
	fan2_aux_pin=PD12,
	fan3_aux_pin=PD13,
	fan4_motor_pin=PD14,
	fan5_motor_pin=PD15,
	heater_bed_heating_pin=PA1,
	heater_bed_sensor_pin=PF3

[temperature_sensor Octopus_Pro_H723_V1.1]
sensor_type: temperature_mcu
