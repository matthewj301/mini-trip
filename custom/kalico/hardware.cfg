# Board pin map and base driver/heater definitions extracted from local RatOS.cfg.
# Machine-specific profiles below override these inherited defaults.
[board_pins btt-octopus-pro-h723-11]
aliases:
	#----------------------------------------------- X motor pins -----------------------------------------------
	# Assigned to slot: "MOTOR 0"
	#------------------------------------------------------------------------------------------------------------
	x_step_pin=PF13,
	x_dir_pin=PF12,
	x_enable_pin=PF14,
	x_uart_pin=PC4,
	x_diag_pin=PG6,
	x_endstop_pin=PG6,
	#----------------------------------------------- Y motor pins -----------------------------------------------
	# Assigned to slot: "MOTOR 1"
	#------------------------------------------------------------------------------------------------------------
	y_step_pin=PG0,
	y_dir_pin=PG1,
	y_enable_pin=PF15,
	y_uart_pin=PD11,
	y_diag_pin=PG9,
	y_endstop_pin=PG9,
	#----------------------------------------------- Z motor pins -----------------------------------------------
	# Assigned to slot: "MOTOR 5"
	#------------------------------------------------------------------------------------------------------------
	z0_step_pin=PC13,
	z0_dir_pin=PF0,
	z0_enable_pin=PF1,
	z0_uart_pin=PE4,
	z0_diag_pin=PG13,
	#------------------------------------------- EXTRUDER motor pins --------------------------------------------
	e_step_pin=PF11,
	e_dir_pin=PG3,
	e_enable_pin=PG5,
	e_uart_pin=PC6,
	#----------------------------------------------- GENERAL PINS -----------------------------------------------
	e_heater_pin=PA0,
	e_sensor_pin=PF4,
	stepper_spi_mosi_pin=PA7,
	stepper_spi_miso_pin=PA6,
	stepper_spi_sclk_pin=PA5,
	adxl345_cs_pin=PA15,
	bltouch_sensor_pin=PB7,
	bltouch_control_pin=PB6,
	probe_pin=PB7,
	fan_part_cooling_pin=PA8,
	fan_toolhead_cooling_pin=PE5,
	fan_controller_board_pin=PD12,
	heater_bed_heating_pin=PA1,
	heater_bed_sensor_pin=PF3,
	4p_fan_part_cooling_pin=null,
	4p_fan_part_cooling_tach_pin=null,
	4p_toolhead_cooling_pin=null,
	4p_toolhead_cooling_tach_pin=null,
	4p_controller_board_pin=null,
	4p_controller_board_tach_pin=null

[temperature_sensor Octopus_Pro_H723_V1.1]
sensor_type: temperature_mcu

[adxl345 controlboard]
cs_pin: PA15
spi_software_mosi_pin: PB5
spi_software_miso_pin: PB4
spi_software_sclk_pin: PB3

[board_pins toolboard_t0]
mcu: toolboard_t0
aliases:
	#------------------------------------------- EXTRUDER motor pins --------------------------------------------
	e_step_pin=PD0,
	e_dir_pin=PD1,
	e_enable_pin=PD2,
	e_uart_pin=PA15,
	#----------------------------------------------- GENERAL PINS -----------------------------------------------
	e_heater_pin=PB13,
	e_sensor_pin=PA3,
	stepper_spi_mosi_pin=null,
	stepper_spi_miso_pin=null,
	stepper_spi_sclk_pin=null,
	adxl345_cs_pin=PB12,
	bltouch_sensor_pin=PB8,
	bltouch_control_pin=PB9,
	probe_pin=PB9,
	fan_part_cooling_pin=PA0,
	fan_toolhead_cooling_pin=PA1,
	fan_controller_board_pin=null,
	heater_bed_heating_pin=null,
	heater_bed_sensor_pin=null,
	4p_fan_part_cooling_pin=null,
	4p_fan_part_cooling_tach_pin=null,
	4p_toolhead_cooling_pin=null,
	4p_toolhead_cooling_tach_pin=null,
	4p_controller_board_pin=null,
	4p_controller_board_tach_pin=null

[temperature_sensor EBB36_v1.2_T0]
sensor_type: temperature_mcu
sensor_mcu: toolboard_t0

[adxl345 toolboard_t0]
axes_map: x, z, y # Assumes back-facing vertical toolboard mounting
cs_pin: toolboard_t0:PB12
spi_software_mosi_pin: toolboard_t0:PB11
spi_software_miso_pin: toolboard_t0:PB2
spi_software_sclk_pin: toolboard_t0:PB10

[extruder]
rotation_distance: 5.57
full_steps_per_rotation: 200
filament_diameter: 1.750
max_extrude_only_velocity: 120
max_extrude_only_accel: 800
pressure_advance_smooth_time: 0.02

[firmware_retraction]
retract_speed: 120
unretract_extra_length: 0
unretract_speed: 120

# Hotend
# T0 Phaetus Rapido UHF definition (from RatOS/hotends/rapido-uhf.cfg)

[extruder]
max_extrude_only_distance: 200
nozzle_diameter: 0.4
heater_pin: toolboard_t0:PB13
sensor_type: PT1000
pullup_resistor: 2200
sensor_pin: toolboard_t0:PA3
min_extrude_temp: 170
min_temp: 0
max_temp: 285
pressure_advance: 0.03

[firmware_retraction]
retract_length: 0.5

# ADXL345 resonance testing configuration

[resonance_tester]
accel_chip_x: adxl345 toolboard_t0
accel_chip_y: adxl345 toolboard_t0
probe_points:
	60,60,20

[tmc5160 stepper_x]
stealthchop_threshold: 0
interpolate: False
cs_pin: PC4
spi_software_mosi_pin: PA7
spi_software_miso_pin: PA6
spi_software_sclk_pin: PA5
run_current: 1
sense_resistor: 0.075

[stepper_x]
step_pin: PF13
dir_pin: PF12
enable_pin: !PF14
microsteps: 64
full_steps_per_rotation: 200
rotation_distance: 40
homing_speed: 50

#---------------------------------------------------- Y -----------------------------------------------------
# The B motor in the CoreXY system
# Connected to MOTOR 1 on BIGTREETECH Octopus Pro H723 V1.1
# Driver: BTT TMC5160(T) Pro v1.1
# Motor: Generic Stepper
# Voltage: 48
#------------------------------------------------------------------------------------------------------------

[tmc5160 stepper_y]
stealthchop_threshold: 0
interpolate: False
cs_pin: PD11
spi_software_mosi_pin: PA7
spi_software_miso_pin: PA6
spi_software_sclk_pin: PA5
run_current: 1
sense_resistor: 0.075

[stepper_y]
step_pin: PG0
dir_pin: PG1
enable_pin: !PF15
microsteps: 64
full_steps_per_rotation: 200
rotation_distance: 40
homing_speed: 50

#---------------------------------------------------- Z -----------------------------------------------------
# The Z motor that moves the bed
# Connected to MOTOR 5 on BIGTREETECH Octopus Pro H723 V1.1
# Driver: BTT TMC2209 v1.3
# Motor: Generic Stepper
# Voltage: 24
#------------------------------------------------------------------------------------------------------------

[tmc2209 stepper_z]
stealthchop_threshold: 0
interpolate: False
uart_pin: PE4
run_current: 0.707
sense_resistor: 0.11

[stepper_z]
step_pin: PC13
dir_pin: PF0
enable_pin: !PF1
microsteps: 64
full_steps_per_rotation: 200
rotation_distance: 8
position_min: -5
homing_speed: 50
endstop_pin: probe:z_virtual_endstop

#------------------------------------------------- EXTRUDER -------------------------------------------------
# The extruder motor used for your toolhead
# Connected to EBB36 v1.2
# Driver: BTT TMC2209 v1.3
# Motor: Generic Stepper
# Voltage: 24
#------------------------------------------------------------------------------------------------------------

[tmc2209 extruder]
stealthchop_threshold: 0
interpolate: False
uart_pin: toolboard_t0:PA15
run_current: 0.5
sense_resistor: 0.11

[extruder]
step_pin: toolboard_t0:PD0
dir_pin: toolboard_t0:PD1
enable_pin: !toolboard_t0:PD2
microsteps: 64
full_steps_per_rotation: 200
rotation_distance: 5.57

[printer]
kinematics: corexy

[heater_bed]
heater_pin: heater_bed_heating_pin
sensor_pin: heater_bed_sensor_pin
sensor_type: NTC 100K MGB18-104F39050L32
min_temp: 0
max_temp: 120

[temperature_sensor raspberry_pi]
sensor_type: temperature_host
