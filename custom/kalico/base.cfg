[virtual_sdcard]
path: ~/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[pause_resume]
[display_status]
[respond]
[exclude_object]
[skew_correction]
[input_shaper]
[force_move]
enable_force_move: True

# Preserve the existing persistence file; no rename or calibration-key migration.
[save_variables]
filename: ~/printer_data/config/ratos-variables.cfg
