[motor_constants ldo-35sth52-2004]
# Custom LDO Nema14 Motor with a 35mm Shaft https://www.fabreeko.com/products/ldo-motors-ldo-35sth52-2004s35?srsltid=AfmBOorByZQqnm_zJmfnYWGZZfCxITsG1Bt9vl3n3g0SVTwn0rluSIPD
resistance: 1.34
inductance: 0.0021
holding_torque: 0.4
max_current: 2
steps_per_revolution: 200

[autotune_tmc stepper_x]
motor: ldo-35sth52-2004
tuning_goal: performance
voltage: ${constants.xy_bus_voltage}
sgt: 3

[autotune_tmc stepper_y]
motor: ldo-35sth52-2004
tuning_goal: performance
voltage: ${constants.xy_bus_voltage}
sgt: 1

[autotune_tmc stepper_z]
motor: omc-17hs15-1504s
tuning_goal: silent
voltage: ${constants.z_bus_voltage}

[autotune_tmc stepper_z1]
motor: omc-17hs15-1504s
tuning_goal: silent
voltage: ${constants.z_bus_voltage}

[autotune_tmc stepper_z2]
motor: omc-17hs15-1504s
tuning_goal: silent
voltage: ${constants.z_bus_voltage}

[autotune_tmc extruder]
motor: ldo-36sth20-1004ahg
voltage: ${constants.e_bus_voltage}