# Octopus Pro fan headers, confirmed by live test 2026-10-19; pin aliases are owned by custom/mcus/octopus-pro-h723.cfg.

# Deck bay electronics fan (FAN0). Not inverted: a plain fan_generic test at SPEED=1 spins it.
[controller_fan electronics_fan]
pin: fan0_electronics_pin
idle_timeout: 300

# 2x motor cooling fans (FAN4 + FAN5)
[multi_pin motor_fans_pins]
pins: fan4_motor_pin, fan5_motor_pin

[controller_fan motor_fans]
pin: multi_pin:motor_fans_pins
stepper: stepper_x, stepper_y
idle_timeout: 300

# 2x stepper-driver cooling fans on the Klipper Expander (MOSFET2 + MOSFET3); aliases in custom/mcus/klipper-expander.cfg
[multi_pin octopus_stepper_fans_pins]
pins: expander:stepper_fan_a_pin, expander:stepper_fan_b_pin

[controller_fan octopus_stepper_fans]
pin: multi_pin:octopus_stepper_fans_pins
idle_timeout: 300
fan_speed: 0.5
