# Octopus Pro fan headers: FAN0=PA8, FAN1=PE5, FAN2=PD12, FAN3=PD13, FAN4=PD14, FAN5=PD15.
# Header-to-role assignment below is from the pre-rebuild wiring plus the 2026-10-14 wiring photo;
# confirm each header physically with SET_FAN_SPEED before relying on it.

# Deck bay electronics fan (FAN0, inverted as in the previous build)
[controller_fan electronics_fan]
pin: !PA8
idle_timeout: 300

# 2x motor cooling fans (FAN1 + FAN2)
[multi_pin motor_fans_pins]
pins: PE5, PD12

[controller_fan motor_fans]
pin: multi_pin:motor_fans_pins
stepper: stepper_x, stepper_y
idle_timeout: 300

# 2x stepper-driver cooling fans on the Klipper Expander (MOSFET0 + MOSFET1)
[multi_pin octopus_stepper_fans_pins]
pins: expander:PA0, expander:PA1

[controller_fan octopus_stepper_fans]
pin: multi_pin:octopus_stepper_fans_pins
idle_timeout: 300
fan_speed: 0.5
