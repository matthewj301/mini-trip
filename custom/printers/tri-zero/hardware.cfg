# Drivers, extruder, bed and kinematics for the rebuilt Tri-Zero (pin aliases live in custom/mcus/).
[extruder]
rotation_distance: 5.57
full_steps_per_rotation: 200
filament_diameter: 1.750
max_extrude_only_velocity: 120
max_extrude_only_accel: 800
pressure_advance_smooth_time: 0.02

[firmware_retraction]
retract_speed: 120
unretract_extra_length: 0
unretract_speed: 120

# Hotend
# T0 Phaetus Rapido UHF definition (from RatOS/hotends/rapido-uhf.cfg)

[extruder]
max_extrude_only_distance: 200
nozzle_diameter: 0.4
heater_pin: toolboard_t0:PB13
sensor_type: PT1000
pullup_resistor: 2200
sensor_pin: toolboard_t0:PA3
min_extrude_temp: 170
min_temp: 0
max_temp: 285
pressure_advance: 0.03

[firmware_retraction]
retract_length: 0.5

# ADXL345 resonance testing configuration

[tmc5160 stepper_x]
stealthchop_threshold: 0
interpolate: False
cs_pin: PC4
spi_software_mosi_pin: PA7
spi_software_miso_pin: PA6
spi_software_sclk_pin: PA5
run_current: 1
sense_resistor: 0.075

[stepper_x]
step_pin: PF13
dir_pin: PF12
enable_pin: !PF14
microsteps: 64
full_steps_per_rotation: 200
rotation_distance: 40
homing_speed: 50

#---------------------------------------------------- Y -----------------------------------------------------
# The B motor in the CoreXY system
# Connected to MOTOR 1 on BIGTREETECH Octopus Pro H723 V1.1
# Driver: BTT TMC5160(T) Pro v1.1
# Motor: Generic Stepper
# Voltage: 48
#------------------------------------------------------------------------------------------------------------

[tmc5160 stepper_y]
stealthchop_threshold: 0
interpolate: False
cs_pin: PD11
spi_software_mosi_pin: PA7
spi_software_miso_pin: PA6
spi_software_sclk_pin: PA5
run_current: 1
sense_resistor: 0.075

[stepper_y]
step_pin: PG0
dir_pin: PG1
enable_pin: !PF15
microsteps: 64
full_steps_per_rotation: 200
rotation_distance: 40
homing_speed: 50

#------------------------------------------------- EXTRUDER -------------------------------------------------
# The extruder motor used for your toolhead
# Connected to EBB36 v1.2
# Driver: BTT TMC2209 v1.3
# Motor: Generic Stepper
# Voltage: 24
#------------------------------------------------------------------------------------------------------------

[tmc2209 extruder]
stealthchop_threshold: 0
interpolate: False
uart_pin: toolboard_t0:PA15
run_current: 0.5
sense_resistor: 0.11

[extruder]
step_pin: toolboard_t0:PD0
dir_pin: toolboard_t0:PD1
enable_pin: !toolboard_t0:PD2
microsteps: 64
full_steps_per_rotation: 200
rotation_distance: 5.57

[printer]
kinematics: corexy

