[virtual_sdcard]
path: ~/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[pause_resume]
[display_status]
[respond]
[exclude_object]
[skew_correction]
[input_shaper]
[force_move]
enable_force_move: True

# Fleet-standard persistence file (fresh install; legacy RatOS keys are not carried over).
[save_variables]
filename: /home/pi/printer_data/config/klipper-variables.cfg
