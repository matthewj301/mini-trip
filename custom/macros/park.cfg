[gcode_macro PICK_PARK_LOCATION]
gcode:
  {% if printer.toolhead.homed_axes == 'xyz' %}
    {% set vars = printer['gcode_macro _PRINTER_VARS'] %}
    {% set saved_accel = printer.toolhead.max_accel %}
    SAVE_GCODE_STATE NAME=_PARK_STATE
    SET_VELOCITY_LIMIT ACCEL={vars.travel_accel}
    G91
    G1 Z{[vars.z_hop_height, printer.toolhead.axis_maximum.z - printer.toolhead.position.z]|min} F600
    G90
    G1 X59 Y5 F{vars.travel_speed * 60}
    RESTORE_GCODE_STATE NAME=_PARK_STATE
    SET_VELOCITY_LIMIT ACCEL={saved_accel}
  {% endif %}

[gcode_macro _FALLBACK_PURGE]
description: Small-bed line purge without KAMP or external macros
gcode:
  {% if printer.toolhead.homed_axes != 'xyz' or not printer.extruder.can_extrude %}
    {action_raise_error('Purge requires homing and extrusion temperature')}
  {% endif %}
  SAVE_GCODE_STATE NAME=_LINE_PURGE
  G90
  M83
  G1 X10 Y5 F6000
  G1 Z0.3 F600
  G1 X60 E2 F600
  G92 E0
  RESTORE_GCODE_STATE NAME=_LINE_PURGE
