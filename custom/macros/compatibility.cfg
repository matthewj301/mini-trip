[gcode_macro START_PRINT]
description: Legacy slicer alias; use PRINT_START for new profiles
gcode:
  {% set tool = params.TOOL|default(params.INITIAL_TOOL|default(0))|int %}
  {% set temps = (params.EXTRUDER_TEMP|default('0')).split(',') %}
  {% set selected = temps[tool] if 0 <= tool < temps|length else temps[0] %}
  # Preserve the former RatOS variable_relative_extrusion=True contract.
  M83
  PRINT_START HOTEND_TEMP={params.HOTEND_TEMP|default(selected)} BED_TEMP={params.BED_TEMP|default(0)} TARGET_CHAMBER_TEMP={params.TARGET_CHAMBER_TEMP|default(params.CHAMBER_TEMP|default(0))} MATERIAL="{params.MATERIAL|default('PLA')}" TOOL={params.TOOL|default(params.INITIAL_TOOL|default(0))}

[gcode_macro END_PRINT]
gcode:
  PRINT_END {rawparams}
