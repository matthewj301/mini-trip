[homing_override]
axes: xyz
gcode: !!include python/home.py

[gcode_macro _HOMING_VARS]
# Effective root RatOS settings, after its generated include overrides.
variable_x_current: 0.82
variable_y_current: 0.69
variable_accel: 1000
variable_z_hop: 8
gcode:

[gcode_macro MAYBE_HOME]
gcode:
  {% set requested = 'XYZ' if not params else ('X' if 'X' in params else '') ~ ('Y' if 'Y' in params else '') ~ ('Z' if 'Z' in params else '') %}
  {% set missing = namespace(axes='') %}
  {% for axis in requested %}
    {% if axis|lower not in printer.toolhead.homed_axes %}
      {% set missing.axes = missing.axes ~ axis ~ ' ' %}
    {% endif %}
  {% endfor %}
  {% if missing.axes %}
    G28 {missing.axes}
  {% endif %}
