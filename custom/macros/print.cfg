# Startup yields during preheat; virtual SD is held until continuation succeeds.
[gcode_macro PRINT_START]
description: Validate, prepare, and start interruptible preheat
gcode: !!include python/print_start.py

[gcode_macro _PRINT_START_STATE]
variable_active: False
variable_sd_paused: False
variable_filename: ''
variable_params: {}
gcode:


[gcode_macro _PRINT_START_BEGIN]
gcode:
  _CLEAR_PRINT_SKEW
  CLEAR_PAUSE
  RESET_MULTIPLIERS
  BED_MESH_CLEAR
  SET_GCODE_OFFSET Z=0
  G90
  M140 S{params.BED_TEMP|default(0)|float}
  M104 S{printer["gcode_macro _PRINTER_VARS"].startup_probe_temp}
  MAYBE_HOME
  SAVE_VARIABLE VARIABLE=current_material VALUE='"{params.MATERIAL|default("PLA")|upper}"'

[gcode_macro _PRINT_START_AFTER_PREHEAT]
gcode:
  {% set params = printer['gcode_macro _PRINT_START_STATE'].params %}
  Z_TILT_ADJUST
  G28 Z
  BED_MESH_CALIBRATE ADAPTIVE=1
  PICK_PARK_LOCATION
  M109 S{params.HOTEND_TEMP|float}
  {% if 'T0' in printer.gcode.commands and (printer.mmu is not defined or printer.mmu.enabled) %}
    T{params.TOOL|default(0)|int}
  {% endif %}
  _PRINT_START_CHECK_READY
  _FALLBACK_PURGE
  MAYBE_LOAD_SKEW_CORRECTION
  SAVE_VARIABLE VARIABLE=is_printing_gcode VALUE=True

[gcode_macro PRINT_END]
gcode:
  {% if params.REASON|default('complete')|lower == 'cancel' %}
    CANCEL_PRINT
  {% else %}
    _CLEAR_PRINT_SKEW
    M400
    {% if printer.extruder.can_extrude %}
      SAVE_GCODE_STATE NAME=_END_RETRACT
      M83
      G1 E-0.5 F3600
      RESTORE_GCODE_STATE NAME=_END_RETRACT
    {% endif %}
    PICK_PARK_LOCATION
    BED_MESH_CLEAR
    COOLDOWN_SEQUENCE QUICK=0
    RESET_TO_START_STATE
    # Keep the triple-belt Z supported; normal idle timeout releases the motors.
  {% endif %}

[gcode_macro PAUSE]
rename_existing: PAUSE_BASE
gcode:
  {% if printer['gcode_macro _PRINT_START_STATE'].active %}
    {action_raise_error("Startup is heating; use TA_CHAMBER_STOP or CANCEL_PRINT to stop")}
  {% endif %}
  {% if printer.pause_resume.is_paused %}
    {action_respond_info("Already paused...")}
  {% else %}
    # Record hotend temp variable for reference in resume macro
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=printing_target_temp VALUE={printer['extruder'].target}

    {% if printer.mmu is defined and printer.mmu.enabled %}
      # Happy Hare owns parking + position save/restore (it also wraps RESUME).
      # Do NOT add our own park/SAVE_GCODE_STATE here or it double-parks and
      # corrupts the saved position. _MMU_PARK is idempotent: it's a no-op when
      # an MMU-driven pause (M600/runout/error) already parked the toolhead.
      _MMU_SAVE_POSITION
      PAUSE_BASE
      _MMU_PARK OPERATION="pause"
    {% else %}
      {% set vars   = printer["gcode_macro _PRINTER_VARS"] %}
      {% set retract_speed = (vars.retract_speed|float*60)|int %}
      {% set retract_length = vars.end_retract_length|float %}

      # The firmware owns the sole print-position snapshot, captured BEFORE parking.
      PAUSE_BASE
      SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=retracted_length VALUE={retract_length if printer.extruder.can_extrude else 0}

      # Retract to reduce oozing
      {% if printer.extruder.can_extrude %}
        SAVE_GCODE_STATE NAME=_PAUSE_EXTRUSION
        M83
        G1 E-{retract_length} F{retract_speed}
        RESTORE_GCODE_STATE NAME=_PAUSE_EXTRUSION
      {% endif %}

      PICK_PARK_LOCATION

      # Cap how long the hotend can sit hot while paused (idle_timeout fires CANCEL_PRINT)
      SET_IDLE_TIMEOUT TIMEOUT={vars.pause_idle_timeout|int}
      # Save parked position in case toolhead needs to move during pause
      SAVE_GCODE_STATE NAME=PAUSEPARK
    {% endif %}
  {% endif %}


[gcode_macro RESUME]
rename_existing: RESUME_BASE
variable_printing_target_temp: 0
variable_retracted_length: 0
gcode:
  {% set vars = printer["gcode_macro _PRINTER_VARS"] %}
  {% if printer['gcode_macro _PRINT_START_STATE'].active %}
    {action_raise_error("Startup is heating; use TA_CHAMBER_STOP or CANCEL_PRINT to stop")}
  {% endif %}
  {% if not printer.pause_resume.is_paused %}
    {action_raise_error("RESUME: printer is not paused")}
  {% endif %}

  {% if printer.mmu is defined and printer.mmu.enabled %}
    # Happy Hare wraps RESUME: it runs this macro (as __RESUME) and then restores
    # the toolhead position itself (single, fast un-park at park_travel_speed).
    # We must NOT restore position here or it fights HH and resumes off-height.
    # Reheat + reapply offset while still parked, then hand back to HH.
    {% if printing_target_temp > 0 %}
      RESPOND MSG="Resuming: heating hotend to {printing_target_temp}C"
      M109 S{printing_target_temp}
    {% endif %}
    {% if printer.configfile.config["gcode_macro _BEACON_SET_NOZZLE_TEMP_OFFSET"] is defined %}
      _BEACON_SET_NOZZLE_TEMP_OFFSET
    {% endif %}
    RESUME_BASE
  {% else %}
    # Run the readiness check in a later macro, after M109 has executed.
    {% if printing_target_temp > 0 %}
      M109 S{printing_target_temp}
    {% endif %}
    _RESUME_NON_MMU
  {% endif %}


[gcode_macro _RESUME_NON_MMU]
description: Recheck extrusion after reheat, then let firmware restore the print position once
gcode:
  {% set vars = printer["gcode_macro _PRINTER_VARS"] %}
  {% set resume = printer["gcode_macro RESUME"] %}
  {% if printer['gcode_macro _PRINT_START_STATE'].active %}
    {action_raise_error("Startup is heating; use TA_CHAMBER_STOP or CANCEL_PRINT to stop")}
  {% endif %}
  {% if not printer.pause_resume.is_paused %}
    {action_raise_error("RESUME: printer is not paused")}
  {% endif %}
  {% if resume.retracted_length|float > 0 and not printer.extruder.can_extrude %}
    {action_raise_error("RESUME: nozzle is still too cold to unretract")}
  {% endif %}
  {% set saved_accel = printer.toolhead.max_accel %}
  SET_VELOCITY_LIMIT ACCEL={vars.travel_accel|float}
  RESTORE_GCODE_STATE NAME=PAUSEPARK MOVE=1 MOVE_SPEED={vars.travel_speed|float / 2}
  {% if printer.configfile.config["gcode_macro _BEACON_SET_NOZZLE_TEMP_OFFSET"] is defined %}
    _BEACON_SET_NOZZLE_TEMP_OFFSET
  {% endif %}
  {% if resume.retracted_length|float > 0 %}
    SAVE_GCODE_STATE NAME=_RESUME_EXTRUSION
    M83
    G1 E{resume.retracted_length|float} F{vars.retract_speed|float * 60}
    RESTORE_GCODE_STATE NAME=_RESUME_EXTRUSION
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=retracted_length VALUE=0
  {% endif %}
  SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout|int}
  RESUME_BASE VELOCITY={vars.travel_speed|float / 2}
  SET_VELOCITY_LIMIT ACCEL={saved_accel}


[gcode_macro CANCEL_PRINT]
rename_existing: BASE_CANCEL_PRINT
description: Cancel print
gcode:
    # Mandatory cancellation is independent of parking, homing and optional hardware.
    TURN_OFF_HEATERS_BASE
    BASE_CANCEL_PRINT
    _TA_CHAMBER_RESET
    M107
    M84
    SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout|int}
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=printing_target_temp VALUE=0
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=retracted_length VALUE=0
    _CLEAR_PRINT_SKEW
    RESET_TO_START_STATE
    {% if "bed_mesh" in printer.configfile.settings %}
        BED_MESH_CLEAR
    {% endif %}
    {% if printer.configfile.config["gcode_macro _BEACON_REMOVE_NOZZLE_TEMP_OFFSET"] is defined %}
        _BEACON_REMOVE_NOZZLE_TEMP_OFFSET
    {% endif %}
    {% if printer.mmu is defined and printer.mmu.enabled %}
        MMU_TTG_MAP RESET=1 QUIET=1
    {% endif %}
    COOLDOWN_SEQUENCE QUICK=1
    {% if "CASE_LIGHTS_OFF" in printer.gcode.commands %} CASE_LIGHTS_OFF {% endif %}
    RESPOND MSG="Print cancelled; heaters and motors off."


[gcode_macro M600]
description: Filament change (pause + unload)
gcode:
	{% set vars = printer["gcode_macro _PRINTER_VARS"] %}
	{% set unload_len = vars.m600_unload_length|float %}
	{% set unload_feedrate = (vars.m600_unload_speed|float * 60)|int %}
	PAUSE
	{% if printer.mmu is defined and printer.mmu.enabled %}
	  MMU_PAUSE
	{% elif printer.configfile.config["gcode_macro UNLOAD_FILAMENT"] is defined %}
	  UNLOAD_FILAMENT
	{% elif printer.extruder.can_extrude %}
	  G91
	  G1 E-{unload_len} F{unload_feedrate}
	  G90
	{% else %}
	  RESPOND MSG="No filament system detected — manual change required"
	{% endif %}
