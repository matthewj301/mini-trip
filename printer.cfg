# Tri-Zero / Mini-Trip — standalone Kalico, clean-install entrypoint.
# See docs/kalico-migration.md before commissioning this rebuilt machine.
[include custom/kalico/mcus.cfg]
[include custom/kalico/hardware.cfg]

[stepper_x]
dir_pin: x_dir_pin
position_min: 0
position_max: 118
position_endstop: 118

[stepper_y]
dir_pin: y_dir_pin
position_min: 0
position_max: 118
position_endstop: 118

[stepper_z]
position_min: -10
position_max: 115

[extruder]
dir_pin: !toolboard_t0:PD1

[include custom/toolheads/rapidburner.cfg]
[include custom/hotends/tk.cfg]
[include custom/printers/tri-zero/tri-zero.cfg]
[include custom/kalico/sensorless.cfg]
[include custom/fans/controller_fans.cfg]
[include custom/fans/aux_fans.cfg]
[include custom/kalico/base.cfg]
[include custom/kalico/variables.cfg]
[include custom/macros.cfg]
# Optional packages: install them first, then enable their existing profiles.
# [include custom/tuning/shaketune.cfg]
# [include custom/tuning/tmc-autotune.cfg]

[resonance_tester]
accel_per_hz: 100
sweeping_accel: 400
sweeping_period: 0

