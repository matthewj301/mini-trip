[include /home/pi/printer_data/config/custom/mcus/*]
[include /home/pi/printer_data/config/custom/default_includes.cfg]

# Machine-specific values retained from this printer; fleet lifecycle defaults are labelled in macros.
# Values retained from this machine unless marked as a new fleet policy default.
[constants]
# TMC autotune bus voltages: 48V on XY (TMC5160), 24V on Z and the extruder.
xy_bus_voltage: 48
z_bus_voltage: 24
e_bus_voltage: 24

[gcode_macro _PRINTER_VARS]
variable_travel_speed: 500
variable_travel_accel: 12000
variable_z_travel_speed: 10
variable_z_hop_height: 8
variable_end_retract_length: 0.5
variable_retract_speed: 60
variable_park_location: "front"
variable_park_front_y_inset: 5
variable_park_rear_inset: 10
# Skew profiles in SAVE_CONFIG are from the earlier build; empty = none loaded until skew is re-measured.
variable_skew_profile: ""
variable_pause_idle_timeout: 7200
variable_startup_probe_temp: 150
variable_default_chamber_assist_extruder_temp: 150
# Chamber heating: bed heat circulated by the aux fan pair (no dedicated chamber heater); target stays opt-in.
variable_chamber_sensor_name: "chamber"
variable_default_chamber_target: 0
variable_chamber_heat_default_bed_temp: 100
variable_chamber_fan: "Aux_Fan"
variable_bed_fan: ""
variable_filter_fan: "filter"
# Fleet policy defaults; soak remains opt-in for the rebuilt machine.
variable_default_material: "PLA"
variable_high_temp_materials: "ABS,ASA,PC,NYLON,PA,PA-CF,PA-GF"
variable_warp_prone_materials: "ABS,ASA,PC,NYLON,PA,PA-CF,PA-GF"
variable_high_temp_threshold: 90
variable_chamber_assist_temp: 80
variable_high_temp_heat_soak_time: 0
variable_standard_heat_soak_time: 0
variable_chamber_heat_timeout: 3600
variable_chamber_heat_max_cycles: 300
variable_chamber_status_interval: 2
variable_chamber_start_delta: 3
variable_chamber_printhead_height: 20
variable_chamber_printhead_fan_speed: 0.5
variable_chamber_move_speed_fast: 100
variable_chamber_move_speed_medium: 100
variable_chamber_move_speed_slow: 100
variable_filter_stop_delay: 300
variable_cooldown_min_bed_temp: 60
variable_cooldown_step_fraction: 0.75
variable_cooldown_final_temp: 45
variable_cooldown_step_dwell: 8
variable_m600_unload_length: 50
variable_m600_unload_speed: 10
variable_notification_printer_name: "Tri-Zero"
variable_notification_name: ""
variable_notification_pause_seconds: 600
gcode:

[stepper_x]
position_min: 0
position_max: 118
position_endstop: 118

[stepper_y]
position_min: 0
position_max: 118
position_endstop: 118

[stepper_z]
position_min: -10
position_max: 115

[extruder]
dir_pin: !toolboard_t0:PD1

[include /home/pi/printer_data/config/custom/tri-zero/hardware.cfg]
[include /home/pi/printer_data/config/custom/toolheads/rapidburner.cfg]
[include /home/pi/printer_data/config/custom/hotends/tk.cfg]
[include /home/pi/printer_data/config/custom/tri-zero/tri-zero.cfg]
[include /home/pi/printer_data/config/custom/fans/*]
[include /home/pi/printer_data/config/custom/sensors/*]
[include /home/pi/printer_data/config/custom/macros.cfg]
[include /home/pi/printer_data/config/custom/tuning/tmc_autotune.cfg]
# Shake&Tune is not installed on this host yet; install it, then enable:
# [include /home/pi/printer_data/config/custom/tuning/shaketune.cfg]
# [include /home/pi/printer_data/config/custom/tuning/resonance.cfg]

